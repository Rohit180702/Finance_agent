version: '3.8'

services:
  redis:
    image: redis/redis-stack:latest
    container_name: finance_agent_redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight UI (optional)
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - finance_agent_network

volumes:
  redis_data:
    driver: local

networks:
  finance_agent_network:
    driver: bridge


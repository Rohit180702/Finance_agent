version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance_agent_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       finance_agent
      POSTGRES_USER:     finance_user
      POSTGRES_PASSWORD: finance_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance_agent_network

  redis:
    image: redis/redis-stack:latest
    container_name: finance_agent_redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight UI (optional)
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - finance_agent_network

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  finance_agent_network:
    driver: bridge

